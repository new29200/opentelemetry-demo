type CartItem {
  productId: String!
  quantity: Int!
}

input CartItemInput {
  productId: String!
  quantity: Int!
}

type Cart {
  userId: String!
  items: [CartItem!]!
}

type Query {
  getCart(userId: String!): Cart!
}

type Mutation {
  addItem(userId: String!, item: CartItemInput!): Boolean!
  emptyCart(userId: String!): Boolean!
}
