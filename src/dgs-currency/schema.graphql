type Money {
  currencyCode: String!
  units: Int!
  nanos: Int!
}

input MoneyInput {                          
  currencyCode: String!
  units: Int!
  nanos: Int!
}

type Query {
  getSupportedCurrencies: [String!]!
  convert(from: MoneyInput!, toCode: String!): Money!
}