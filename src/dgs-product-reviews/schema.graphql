type ProductReview {
  username: String!
  description: String!
  score: String!
}

type Query {
  getProductReviews(productId: String!): [ProductReview!]!
  getAverageProductReviewScore(productId: String!): String!
  askProductAIAssistant(productId: String!, question: String!): String!
}
